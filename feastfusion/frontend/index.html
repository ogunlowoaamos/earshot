<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6F0" />
    <meta
      name="description"
      content="FeastFusion — freshly cooked meals, fried favourites, soups and desserts. Delivery, pickup and private catering across Abuja."
    />
    <script>
      // Runs before first paint so the theme never flashes light on reload.
      (function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('feastfusion.theme')
          theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (e) {
          theme = 'light'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#100E0B' : '#FAF6F0')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Onest:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <title>FeastFusion — Cooked with love, delivered hot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
